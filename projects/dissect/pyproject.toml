[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dissect"
description = "Dissect is a digital forensics & incident response framework and toolset that allows you to quickly access and analyse forensic artefacts from various disk and file formats, developed by Fox-IT (part of NCC Group)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [
  {name = "Dissect Team", email = "dissect@fox-it.com"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Log Analysis",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = [
    "dissect.apfs>=1.1,<2",
    "dissect.archive>=1.8,<2",
    "dissect.btrfs>=1.10,<2",
    "dissect.cim>=3.13,<4",
    "dissect.clfs>=1.11,<2",
    "dissect.cramfs>=1.1,<2",
    "dissect.cstruct>=4.7,<5",
    "dissect.database>=1.1,<2",
    "dissect.etl>=3.14,<4",
    "dissect.eventlog>=3.11,<4",
    "dissect.evidence>=3.13,<4",
    "dissect.executable>=1.11,<2",
    "dissect.extfs>=3.15,<4",
    "dissect.fat>=3.13,<4",
    "dissect.ffs>=3.12,<4",
    "dissect.fve>=4.6,<5",
    "dissect.hypervisor>=3.21,<4",
    "dissect.jffs>=1.6,<2",
    "dissect.ntfs>=3.16,<4",
    "dissect.ole>=3.12,<4",
    "dissect.qnxfs>=1.2,<2",
    "dissect.regf>=3.14,<4",
    "dissect.shellitem>=3.13,<4",
    "dissect.squashfs>=1.12,<2",
    "dissect.target[full]>=3.25.1,<4",
    "dissect.thumbcache>=1.11,<2",
    "dissect.util>=3.24,<4",
    "dissect.vmfs>=3.13,<4",
    "dissect.volume>=3.18,<4",
    "dissect.xfs>=3.13,<4",
]
version = "3.22"

[project.urls]
homepage = "https://dissect.tools"
documentation = "https://docs.dissect.tools"
repository = "https://github.com/fox-it/dissect"

[project.scripts]
dissect = "dissect.cli:main"

[tool.setuptools.packages.find]
include = ["dissect", "dissect.*"]
namespaces = true
where = ["src"]

[tool.uv.sources."dissect.apfs"]
workspace = true

[tool.uv.sources."dissect.archive"]
workspace = true

[tool.uv.sources."dissect.btrfs"]
workspace = true

